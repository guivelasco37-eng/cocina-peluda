<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --naranja:#ff8a00; --verde:#1f4d2b; --mostaza:#ffc400; --crema:#fff6e8;
    --rojo:#d62828; --amarillo:#ffd60a; --boton:#1fa34a; --boton-osc:#178a3d;
    --texto:#1f2a22; --gris:#6b6f6c; --fondo-claro:#f4f5f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{background:#fff;color:var(--texto);font-family:Nunito,ui-sans-serif,system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block;height:auto}
  .col{max-width:480px;margin:0 auto;padding:0 16px}
  b,strong{font-weight:900}

  /* logo */
  .logo{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 0 4px;font-weight:900;font-size:22px;letter-spacing:-.01em;color:var(--verde)}
  .logo .pata{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--naranja);font-size:18px}
  .logo span.p2{color:var(--naranja)}

  /* botón de compra */
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;padding:14px 16px;border:0;border-radius:14px;background:var(--boton);color:#fff;font-family:inherit;font-weight:900;font-size:18px;line-height:1.2;text-align:center;text-transform:uppercase;text-decoration:none;letter-spacing:.01em;box-shadow:0 5px 0 var(--boton-osc),0 10px 22px rgba(31,163,74,.3);cursor:pointer;animation:pulso 1.8s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--boton-osc)}
  @keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .seguro{text-align:center;font-size:15px;font-weight:700;color:var(--gris);margin-top:12px}
  .recusa{text-align:center;margin-top:20px}
  .recusa a{color:#8a8d8b;font-size:15px;line-height:1.4;text-decoration:underline}

  /* video */
  .vsl{position:relative;width:100%;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#d9dbd8;display:grid;place-items:center;margin-top:18px}
  .vsl .play{width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
  .vsl .play::after{content:"";margin-left:7px;border-style:solid;border-width:18px 0 18px 30px;border-color:transparent transparent transparent #fff}

  /* bloque con retraso */
  .esconder{visibility:hidden;height:0;overflow:hidden;margin:0!important;animation:none!important}
  .bloque-boton{margin-top:22px;animation:aparece .5s ease}
  @keyframes aparece{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){.btn,.bloque-boton{animation:none}}

  .alerta{background:var(--rojo);color:#fff;text-align:center;padding:20px 16px 18px}
  .alerta .ok{font-weight:900;font-size:14px;letter-spacing:.02em;line-height:1.35;text-transform:uppercase}
  .alerta .no{font-size:13px;font-weight:700;margin-top:6px;letter-spacing:.04em;opacity:.95}
  .alerta h1{margin-top:14px;font-weight:900;line-height:1.08}
  .alerta h1 .l1{display:block;font-size:30px}
  .alerta h1 .l2{display:block;font-size:40px;color:var(--amarillo);letter-spacing:-.01em}
  .alerta .dedo{font-size:46px;line-height:1;margin-top:8px;animation:baja 1.4s ease-in-out infinite}
  @keyframes baja{50%{transform:translateY(6px)}}
  .titulo{text-align:center;font-weight:900;color:var(--verde);font-size:25px;line-height:1.22;margin-top:10px}
  .fin{height:40px}
  @media (prefers-reduced-motion:reduce){.alerta .dedo{animation:none}}

</style>
</head>
<body>
<header class="alerta">
  <p class="ok">✅ Tu compra está confirmada. Tu acceso llega a tu correo en unos minutos.</p>
  <p class="no">NO CIERRES ESTA PÁGINA TODAVÍA.</p>
  <h1><span class="l1">¡Mira el video de abajo</span><span class="l2">ANTES DE ENTRAR!</span></h1>
  <div class="dedo" aria-hidden="true">👇</div>
</header>
<main class="col">
  <div class="logo"><span class="pata">🐾</span><span>Cocina <span class="p2">Peluda</span></span></div>
  <h2 class="titulo">Un Chihuahua no come, no se enferma y no se educa igual que un Labrador.</h2>

  <div id="vsl-upsell-1" class="vsl">
    <!-- COLE AQUI O EMBED DA VSL -->
    <!-- (o retângulo cinza com o play é só um exemplo visual: apague o <span> abaixo quando colar o embed) -->
    <span class="play" aria-hidden="true"></span>
  </div>

  <!-- Este bloco aparece depois de ATRASO_SEGUNDOS (veja o script no final da página). -->
  <div class="bloque-boton esconder">
    <div id="hotmart-upsell-1" class="widget-hotmart">
      <!-- HOTMART - Sales Funnel Widget -->
      <!--- sales funnel container --->
      <div id="hotmart-sales-funnel"></div>
      <!--- script load and setup --->
      <script src="https://checkout.hotmart.com/lib/hotmart-checkout-elements.js"></script>
      <script>
      checkoutElements.init('salesFunnel').mount('#hotmart-sales-funnel')
      </script>
      <!-- HOTMART - Sales Funnel Widget -->
    </div>
    <p class="seguro">🔒 Pago único · Garantía de 7 días</p>
    
  </div>
  <div class="fin"></div>
</main>
<script>
  // Tempo (em segundos) até o botão aparecer.
  // se usar o atraso do próprio player, apague este timer
  var ATRASO_SEGUNDOS = 30;
  setTimeout(function(){
    var b = document.querySelectorAll('.esconder');
    for (var i = 0; i < b.length; i++) b[i].classList.remove('esconder');
  }, ATRASO_SEGUNDOS * 1000);
</script>
</body>
</html>
